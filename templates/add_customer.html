<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer - VeloRent</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #1f2937;
        }

        .container {
            width: 550px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Add New Customer</h1>

        <p class="subtitle">
            Enter customer details below
        </p>


        <form action="{{ url_for('save_customer') }}" method="POST">

            <!-- Name -->
            <div class="form-group">

                <label>Customer Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter full name"
                    required
                >

            </div>


            <!-- Phone -->
            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email address"
                >

            </div>


            <!-- Address -->
            <div class="form-group">

                <label>Address</label>

                <textarea
                    name="address"
                    placeholder="Enter customer address"
                ></textarea>

            </div>


            <!-- License -->
            <div class="form-group">

                <label>Driving License Number</label>

                <input
                    type="text"
                    name="license_no"
                    placeholder="Enter license number"
                    required
                >

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <a
                    href="{{ url_for('customers') }}"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn save-btn"
                >
                    Add Customer
                </button>

            </div>

        </form>

    </div>

</body>

</html>
